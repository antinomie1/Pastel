[package]
name = "pastel"
description = "A modular scrolling Wayland compositor built on luminaria"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pastel-core.workspace = true
pastel-layout.workspace = true
pastel-config.workspace = true
pastel-render.workspace = true
pastel-ipc.workspace = true
luminaria.workspace = true
libc = "0.2"

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
