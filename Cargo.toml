[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pastel-core = { path = "crates/pastel-core" }
pastel-layout = { path = "crates/pastel-layout" }
pastel-config = { path = "crates/pastel-config" }
pastel-render = { path = "crates/pastel-render" }
# A sibling checkout: Pastel needs changes that aren't on GitHub yet (AGENTS.md).
luminaria = { path = "../luminaria/bindings/rust", features = ["text"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
lto = "thin"
