[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"

[workspace.dependencies]
pastel-core = { path = "crates/pastel-core" }
pastel-layout = { path = "crates/pastel-layout" }
pastel-config = { path = "crates/pastel-config" }
pastel-render = { path = "crates/pastel-render" }
pastel-ipc = { path = "crates/pastel-ipc" }
# Pinned to a commit; bump `rev` to update. To hack on both, see AGENTS.md.
luminaria = { git = "https://github.com/antinomie1/luminaria", rev = "ca53d11651aa7c33b4676b9056b546a6d596fbaa", features = ["text"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
lto = "thin"
