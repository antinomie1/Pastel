[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"

[workspace.dependencies]
pastel-core = { path = "crates/pastel-core" }
pastel-layout = { path = "crates/pastel-layout" }
pastel-config = { path = "crates/pastel-config" }
pastel-render = { path = "crates/pastel-render" }
# Pinned to a commit; bump `rev` to update. To hack on both, see AGENTS.md.
luminaria = { git = "https://github.com/antinomie1/luminaria", rev = "4c80a32edbf9fe98bffd7f2453766c3a66b6a77d", features = ["text"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
lto = "thin"
